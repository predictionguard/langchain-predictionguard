[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "langchain-predictionguard"
version = "0.4.0"
authors = [
    {name="Jacob Mansdorfer", email="jacob@predictionguard.com"}
]
description = "[DEPRECATED] Prediction Guard LangChain integration. No longer maintained; use langchain-openai or langchain-anthropic instead."
description-file = "README.md"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 7 - Inactive",
]
dependencies = [
    "langchain-core>=1.5.3,<2",
    "predictionguard>=2.11.2,<3",
    "requests>=2.34.2,<3",
]

[tool.uv]
exclude-newer = "2026-07-31T12:33:43.000+00:00"
exclude-newer-package = { predictionguard = "2026-08-03T19:45:44.44Z", markupsafe = false }

[tool.uv.pip]
require-hashes = true

[project.urls]
Homepage = "https://predictionguard.com"
Documentation = "https://docs.langchain.com/oss/python/integrations/providers/predictionguard"
Repository = "https://github.com/predictionguard/langchain-predictionguard.git"
Issues = "https://github.com/predictionguard/langchain-predictionguard/issues"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
]